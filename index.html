<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TenderBase — discover South African public tenders." />
  <title>TenderBase — Tender Discovery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Tender<span>Base</span></div>
    <div class="status"><i></i> Live tender data</div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">SOUTH AFRICAN PROCUREMENT</p>
        <h1>Find tenders worth chasing.</h1>
        <p class="hero-copy">Search current opportunities, filter by province and category, and open the tender details.</p>
      </div>
      <div class="hero-stat"><strong id="totalCount">—</strong><span>tenders available</span></div>
    </section>

    <section class="search-panel">
      <div class="search-row">
        <input id="q" type="search" placeholder="Search tender title or description…" autocomplete="off" />
        <button id="searchBtn">Search</button>
      </div>
      <div class="filters">
        <select id="province"><option value="">All provinces</option><option>Eastern Cape</option><option>Free State</option><option>Gauteng</option><option>KwaZulu-Natal</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option><option>Western Cape</option></select>
        <select id="status"><option value="">All statuses</option><option>Published</option><option>Closed</option><option>Cancelled</option><option>Awarded</option></select>
        <select id="tenderType"><option value="">All tender types</option><option value="RFQ">RFQ</option><option value="RFP">RFP</option><option value="ITT">ITT</option><option value="EOI">EOI</option></select>
        <input id="department" type="search" placeholder="Department / buyer" />
      </div>
    </section>

    <div class="toolbar"><span id="resultText">Loading tenders…</span><select id="sort"><option value="newest">Newest first</option><option value="closing">Closing soon</option></select></div>
    <section id="results" class="results"></section>
    <div id="empty" class="empty hidden">No tenders matched your search.</div>
    <div class="pagination"><button id="prev">← Previous</button><span id="pageText">Page 1</span><button id="next">Next →</button></div>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="closeModal" class="close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
